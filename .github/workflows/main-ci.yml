name: Main-ci

on:
  push:
    branches: [main]
  release:
    types: [published]


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o BeMovin .

      - name: Test
        run: go test ./...

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest = tip of main (what Dokploy deploys). Releases also get
          # their version tag, every build gets a sha-xxxxxxx tag for rollbacks.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Dokploy deploy
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 15 --max-time 60 -X POST "${{ secrets.DOKPLOY_WEBHOOK }}"
